<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neihu Traffic System Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- AI + Video libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>

<body>
    <div class="map-container">
        <!-- Google Map with Traffic Layer embedded in iframe -> styling in CSS applies a Dark Mode filter -->
        <iframe src="https://maps.google.com/maps?q=Xihu+Market,+Taipei&t=m&z=15&output=embed&layer=t" frameborder="0"
            allowfullscreen class="interactive-map">
        </iframe>

        <div class="overlay-mesh"></div>
    </div>

    <!-- Glassmorphic Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-box">
                <div class="pulse-ring"></div>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
                    <line x1="9" y1="3" x2="9" y2="18"></line>
                    <line x1="15" y1="6" x2="15" y2="21"></line>
                </svg>
            </div>
            <div>
                <h1 class="brand-title">NEIHU<span class="accent">NEXUS</span></h1>
                <p class="brand-subtitle">LIVE TRAFFIC ANALYSIS</p>
            </div>
        </div>

        <div class="status-panel">
            <h2 class="panel-heading">System Status</h2>
            <div class="status-pill active">
                <span class="dot"></span>
                <span>Live Feed Active</span>
            </div>
        </div>

        <div class="dashboard-widgets">
            <div class="widget">
                <div class="widget-icon">⚡</div>
                <div class="widget-content">
                    <h3 class="widget-label">Avg Speed</h3>
                    <div class="widget-value" id="avg-speed">42 <span class="unit">km/h</span></div>
                </div>
            </div>

            <div class="widget">
                <div class="widget-icon">📊</div>
                <div class="widget-content">
                    <h3 class="widget-label">Congestion Index</h3>
                    <div class="widget-value" id="congestion-index">1.4 <span class="unit">low</span></div>
                </div>
            </div>

            <div class="widget warning-widget">
                <div class="widget-icon">⚠️</div>
                <div class="widget-content">
                    <h3 class="widget-label">Active Incidents</h3>
                    <div class="widget-value" id="active-incidents">0</div>
                </div>
            </div>
        </div>

        <div class="recent-events">
            <h2 class="panel-heading">Active Zones</h2>
            <ul class="event-list" id="event-list">
                <!-- Dynamically populated -->
            </ul>
        </div>

        <div class="footer-timestamp">
            Last Updated: <span id="timestamp">--:--:--</span>
        </div>
    </aside>

    <!-- Video Modal with AI Detection -->
    <div id="video-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <div style="display:flex; align-items:center; gap:12px; flex:1;">
                    <h3 id="modal-title" style="color:var(--accent-cyan); font-family:var(--font-display);">Live Traffic
                        Cam</h3>
                    <div id="ai-status"
                        style="font-size:0.7rem; color:var(--status-warning); font-family:var(--font-display); letter-spacing:1.5px;">
                        ⏳ LOADING AI…</div>
                </div>
                <div style="display:flex; align-items:center; gap:14px;">
                    <div style="text-align:center;">
                        <div style="font-family:var(--font-display); font-size:1.4rem; color:var(--accent-cyan); line-height:1;"
                            id="ped-counter">0</div>
                        <div style="font-size:0.6rem; color:#8a9fc2; letter-spacing:1.5px;">PEDESTRIANS</div>
                    </div>
                    <button id="draw-zone-btn" title="Click to draw zebra crossing zone on the video"
                        style="background:rgba(0,243,255,0.1); border:1px solid var(--accent-cyan); color:var(--accent-cyan);
                        font-family:var(--font-display); font-size:0.65rem; letter-spacing:1.2px; padding:6px 12px;
                        border-radius:6px; cursor:pointer; transition:all 0.2s;">
                        ✏️ DRAW ZONE
                    </button>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
            </div>
            <div style="position:relative; background:#000;">
                <video id="cctv-video" class="cctv-iframe" autoplay muted playsinline style="display:none;"></video>
                <iframe id="cctv-iframe" class="cctv-iframe" frameborder="0" allowfullscreen></iframe>
                <canvas id="ai-canvas"
                    style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
